<!DOCTYPE html>
<head>
    <title>Number 1-10</title>
</head>
<body>
<script>
     // 1. Print numbers from 1 to 10
    document.write("<h3>Numbers from 1 to 10:</h3>");

    for (let i = 1; i <= 10; i++) {
        document.write(i + "<br>");
    }


    // 2. Print  numbers from 1 to 100
    document.write("<h3>Numbers from 1 to 100:</h3>");

    for (let i = 1; i <= 100; i++) {
       
            document.write(i + "<br>");
        
    }


    // 3. Print even numbers between 1 and 100
    document.write("<h3>Even numbers between 1 and 100:</h3>");

    for (let i = 2; i <= 100; i = i + 2) {
        document.write(i + "<br>");
    }

</script>
</body>
</html>
