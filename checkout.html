<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Mamta Kids Collection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html"><img src="images/fashion-logo.png" alt="Mamta Kids Collection"></a></div>
        <nav aria-label="Main navigation"><a href="index.html" aria-label="Home" title="Home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2 1 11h3v10h16V11h3L12 2z M10 21v-7h4v7z"/></svg></a><a href="shop.html" aria-label="Shop" title="Shop"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.2 13H5.2L4 8Zm4-2a4 4 0 0 1 8 0v2h-2V6a2 2 0 0 0-4 0v2H8V6Z"/></svg></a><a href="cart.html" aria-label="Cart" title="Cart"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.4 12.1a2 2 0 0 0 2 1.6h9.2a2 2 0 0 0 2-1.6L22 7H6.2l-.4-2H2v-2Zm8 15.5a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Zm8 0a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z"/></svg></a><a href="contact.html" aria-label="Contact" title="Contact"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M5 5h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm-.6 3.2 7.6 5.4 7.6-5.4a1 1 0 0 0-.6-.2H5a1 1 0 0 0-.6.2Z"/></svg></a></nav>
    </header>
    <main class="checkout-page">
        <h1>Secure checkout</h1>
        <p>Review your order and enter delivery details.</p>
        <section class="checkout-summary">
            <h2>Your order</h2>
            <div id="checkoutSummary" aria-live="polite">Loading your cart…</div>
        </section>
        <form class="checkout-form" id="checkoutForm">
            <h2>Delivery details</h2>
            <label for="name">Full name</label>
            <input type="text" id="name" autocomplete="name" maxlength="120" required>
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" maxlength="200" required>
            <label for="address">Street address</label>
            <input type="text" id="address" autocomplete="street-address" maxlength="300" required>
            <label for="city">City</label>
            <input type="text" id="city" autocomplete="address-level2" maxlength="120" required>
            <label for="pincode">PIN code</label>
            <input type="text" id="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="20" required>
            <h2>Payment method</h2>
            <label class="payment-option"><input type="radio" name="payment" value="cod" required> Cash on delivery</label>
            <label class="payment-option"><input type="radio" name="payment" value="online" required> Online payment (UPI, cards, net banking)</label>
            <button id="placeOrderBtn" type="submit">Place order</button>
            <p id="checkoutMessage" role="status"></p>
        </form>
    </main>
    <footer class="footer"><div class="footer-section"><h2>Mamta Kids Collection</h2><p>Little looks. Big smiles.</p></div><div class="footer-bottom">&copy; 2026 Mamta Kids Collection. All rights reserved.</div></footer>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="JS/script.js"></script>
</body>
</html>
